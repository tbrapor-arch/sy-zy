exercises:
  translate:
  - hanzi: 我 以前 一 个 礼拜 要 去 两 埭 菜场 。
    en: I used to go to the market twice a week.
  - hanzi: 伊 蹲 辣 我 对过 ， 阿拉 是 隔壁邻舍 。
    en: She lives opposite me, we're neighbours.
  - hanzi: 外婆 个 闲话 我 只 听得懂 一眼眼 。
    en: I can only understand a little of what Grandma says.
  fill:
  - hanzi: 银行 就 辣 地铁站 ＿ 。
    en: The bank is right opposite the metro station.
    answer: 对过
  - hanzi: 今朝 冷 ， 明朝 ＿ 冷 。
    en: It's cold today, and tomorrow it'll be even colder.
    answer: 更加
  - hanzi: 伊 一 个 人 吃 了 三 碗 面 ， 真 ＿ ！
    en: He ate three bowls of noodles by himself, impressive!
    answer: 结棍
  say:
  - hanzi: 我 要 买 一 张 来回 票 。
    en: I'd like a return ticket.
  - hanzi: 侬 有 亲眷 辣 美国 伐 ？
    en: Do you have relatives in America?
  - hanzi: 我 想 坐 辣 窗门 边浪 。
    en: I'd like to sit by the window.
