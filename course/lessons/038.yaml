exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 鱼 清蒸 顶 鲜 。
    en: This fish is best steamed.
  - hanzi: 上海闲话 讲 起来 难 伐 ？
    en: Is Shanghainese hard to speak?
  - hanzi: 侬 慢慢叫 跑 ， 我 辣 门口 等 侬 。
    en: Take your time, I'll wait for you at the door.
  fill:
  - hanzi: 搿 只[ʦᴀʔ55] 菜 老 ＿ 个 ， 侬 吃吃看 。
    en: This dish is really tasty, try it.
    answer: 鲜
  - hanzi: 番茄 ＿ 好 再 切一切 。
    en: Peel the tomatoes before cutting them.
    answer: 剥
  - hanzi: 蟹 有 八 只[ʦᴀʔ55] ＿ 。
    en: A crab has eight legs.
    answer: 脚
  say:
  - hanzi: 我 欢喜 吃 蟹 。
    en: I like crab.
  - hanzi: 红烧肉 吃 起来 有 一眼 甜 。
    en: Red-braised pork tastes a little sweet.
  - hanzi: 蘸 一眼 醋 再 吃 。
    en: Dip it in a bit of vinegar before you eat it.
