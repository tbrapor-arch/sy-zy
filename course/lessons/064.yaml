exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 箱子 忒 重 ， 我 一 个 人 抬 勿 动 。
    en: This box is too heavy, I can't lift it on my own.
  - hanzi: 我 住 三 楼 ， 楼下 是 阿姨 屋里 。
    en: I live on the third floor; downstairs is the auntie's.
  - hanzi: 侬 拿 椅子 搬 到 阳台 浪 去 。
    en: Take the chair out to the balcony.
  fill:
  - hanzi: 电梯 坏脱 了 ， 阿拉 走 ＿ 上去 。
    en: The lift is broken, let's take the stairs up.
    answer: 楼梯
  - hanzi: 当心 ， 覅 拿 碗 ＿ 。
    en: Careful, don't break the bowls.
    answer: 打破
  - hanzi: 侬 新 房子 辣 第 几 ＿ ？
    en: Which floor is your new flat on?
    answer: 楼
  say:
  - hanzi: 我 下去 拿 物事 上来 。
    en: I'll go down and bring the things up.
  - hanzi: 被头 先 放 辣海 ， 覅 动 。
    en: Leave the quilt there for now, don't touch it.
  - hanzi: 搿 只[ʦᴀʔ55] 沙发 老 重 个 。
    en: This sofa is really heavy.
