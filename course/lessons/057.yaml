exercises:
  translate:
  - hanzi: 外头 人 多 ， 有得 等 了 。
    en: 'There are a lot of people outside: we''re in for a long wait.'
  - hanzi: 搿 桩 事体 呒啥 好 讲 个 。
    en: There's nothing to say about this business.
  - hanzi: 伊 门槛精 ， 买 物事 老 懂经 个 。
    en: 'She''s sharp: she really knows what she''s doing when she shops.'
  fill:
  - hanzi: 礼拜天 阿拉 去 外滩 ＿ 。
    en: On Sunday we're going to the Bund for a bit of fun.
    answer: 白相相
  - hanzi: 明朝 一道 吃 夜饭 ， ＿ 伐 ？
    en: 'Dinner together tomorrow: is that all right?'
    answer: 来三
  - hanzi: 等 我 ＿ ， 我 马上 就 来 。
    en: Wait a second for me, I'm coming right away.
    answer: 一歇歇
  say:
  - hanzi: 侬 会 搓 麻将 伐 ？
    en: Can you play mahjong?
  - hanzi: 今朝 我 赢 了 ！
    en: I've won today!
  - hanzi: 搓 麻将 老 扎劲 个 。
    en: Mahjong is great fun.
