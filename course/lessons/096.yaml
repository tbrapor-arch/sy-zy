exercises:
  translate:
  - hanzi: 我 宁可 走 ， 也 勿 要 乘 差头 。
    en: I'd rather walk than take a taxi.
  - hanzi: 搿 只[ʦᴀʔ55] 地方 老早 老 冷清 个 。
    en: This place used to be very deserted.
  - hanzi: 新 个 地铁 站 造好 了 。
    en: The new metro station has been built.
  fill:
  - hanzi: 伊 拨 经理 ＿ 了 一 顿 。
    en: He got a dressing-down from the manager.
    answer: 骂
  - hanzi: 今朝 江 浪 ＿ 老 大 。
    en: It's very windy on the river today.
    answer: 风
  - hanzi: 落 雾 了 ， ＿ 停 了 。
    en: There's fog, the ferry has stopped.
    answer: 摆渡
  say:
  - hanzi: 阿拉 去 乘 摆渡 。
    en: Let's take the ferry.
  - hanzi: 浦东 老 勿 一样 了 。
    en: Pudong is very different now.
  - hanzi: 真 想勿到 ！
    en: I'd never have thought it!
