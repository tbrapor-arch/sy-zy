# Lesson schema: see course/README.md. hanzi = words separated by spaces (one space = one sandhi domain);
# a word can force its reading with IPA + Chao tones: 新[ɕin53], 法国人[fᴀʔ55_koʔ55_ȵin13].
id: 7
title:
  en: Review
  hanzi: 复习
review: true
setting: >-
  Sunday evening. Sam is back in the lane; the auntie is sitting outside her door.
dialogue:
- n: 1
  speaker: 阿姨
  hanzi: Sam ， 侬 今朝 做 啥 了 ？
  en: Sam, what did you do today?
  lit: Sam, you today do what (now)?
- n: 2
  speaker: Sam
  hanzi: 我 搭 小李[ɕiɔ34_li13] 一道 去 豫园[ɦy13_ɦyø13] 白相 了 。
  en: I went to Yuyuan with Xiao Li.
  lit: I and Little-Li together go Yuyuan play (done)
- n: 3
  speaker: 阿姨
  hanzi: 远 伐 ？
  en: Was it far?
- n: 4
  speaker: Sam
  hanzi: 勿 远 ， 阿拉 坐 地铁 去 个 。
  en: Not far, we took the metro.
  lit: not far, we sit metro go (it was)
- n: 5
  speaker: 阿姨
  hanzi: 小笼 吃 过 了 伐 ？
  en: Did you have soup dumplings?
- n: 6
  speaker: Sam
  hanzi: 吃 过 了 ， 老 好吃 个 ！ 就是[ʑiɤ13_zɿ13] 忒 烫 了 。
  en: Yes, really good! Just too hot.
  lit: eaten (done), very tasty (really)! only-that too hot (now)
- n: 7
  speaker: 阿姨
  hanzi: 侬 上海闲话 越[ɦyɪʔ12] 讲 越[ɦyɪʔ12] 好 了 ！
  en: Your Shanghainese gets better and better!
  lit: you Shanghai-talk more speak more good (now)
- n: 8
  speaker: Sam
  hanzi: 谢谢 阿姨 ！ 侬 是 我 个 老师 。
  en: Thanks, auntie! You're my teacher.
notes:
- ref: 1
  text: >-
    Questions, so far. A yes–no question ends in 伐: 远伐？ 吃过了伐？ A question with a question word needs no 伐: 啥 what,
    啥人 who, 啥地方 where, 几钿 how much, 几 how many, 哪能 how, 做啥 why.
- ref: 2
  text: >-
    Pronouns: 我 I, 侬 you, 伊 he or she; 阿拉 we, 㑚 you (plural), 伊拉 they. 阿拉 is also "my" for family and home: 阿拉屋里,
    阿拉老公.
- ref: 4
  text: >-
    Three ways to say no. 勿 veq "not": 勿远, 勿是. 覅 viau "don't!": 覅客气. 呒没 m-meq "there isn't, haven't": 还呒没 "not yet".
- ref: 4
  text: >-
    个 at the end of a sentence (去个, 好吃个) confirms or stresses: "that's how it was", "it really is". The same 个 after
    a noun marks possession: 我个老师 "my teacher".
- ref: 6
  text: >-
    了 at the end of a sentence shows a change or something done: 吃过了 "eaten", 忒烫了 "(it got) too hot", 好了 "better
    now".
- ref: 7
  text: >-
    越…越… "the more…the more…": 越讲越好 "the more you speak, the better (it gets)", as in Mandarin.
exercises:
  fill:
  - hanzi: 侬 今朝 做 ＿ 了 ？
    en: What did you do today?
    answer: 啥
  - hanzi: ＿ 远 。
    en: (It's) not far.
    answer: 勿
  - hanzi: 还 ＿ 。
    en: Not yet.
    answer: 呒没
  say:
  - hanzi: 侬 是 我 个 老师 。
    en: You're my teacher.
