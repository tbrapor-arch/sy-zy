exercises:
  translate:
  - hanzi: 阿要 吃 一眼 水果 ？
    en: Would you like some fruit?
  - hanzi: 伊 老 和气 个 ， 也 老 大方 。
    en: She's very kind, and very generous too.
  - hanzi: 客人 来 了 ， 当然 要 请 伊拉 吃 饭 。
    en: When guests come, of course you invite them to eat.
  fill:
  - hanzi: ＿ 光临 ！ 请 坐 。
    en: Welcome! Please sit down.
    answer: 欢迎
  - hanzi: 侬 ＿ 早 点 困 。
    en: You should go to bed earlier.
    answer: 应该
  - hanzi: 真 是 ＿ 了 ， 谢谢 侬 。
    en: Sorry for all the trouble, thank you.
    answer: 添麻烦
  say:
  - hanzi: 走好 ！
    en: Take care!
  - hanzi: 阿要 吃 杯 茶 ？
    en: Would you like some tea?
  - hanzi: 上海 人 老 热情 个 。
    en: Shanghai people are very warm.
