exercises:
  translate:
  - hanzi: 我 每 个 礼拜 侪 去 超市 买 菜 。
    en: I go to the supermarket every week.
  - hanzi: 伊 勿大 讲 闲话 。
    en: He hardly talks.
  - hanzi: 搿 只[ʦᴀʔ55] 电脑 是 我 上个月 买 个 。
    en: I bought this computer last month.
  fill:
  - hanzi: 侬 买 了 介 多 勿 用 ， 真 ＿ 。
    en: 'You bought so much and don''t use it: such a waste.'
    answer: 浪费
  - hanzi: 一 个 月 ＿ 要 存 一千 块 。
    en: You need to save at least a thousand a month.
    answer: 至少
  - hanzi: ＿ 买 物事 老 方便 。
    en: Shopping online is very convenient.
    answer: 网上
  say:
  - hanzi: 我 银行 里 呒没 钞票 了 。
    en: There's no money left in my account.
  - hanzi: 下个月 我 要 节约 。
    en: Next month I'm going to economise.
  - hanzi: 侬 拿 发票 拨 我 。
    en: Give me the receipt.
