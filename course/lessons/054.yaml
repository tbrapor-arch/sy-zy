exercises:
  translate:
  - hanzi: 天 暗 下来 了 ， 就要 落雨 了 。
    en: The sky has gone dark, it's about to rain.
  - hanzi: 外头 落雨 ， 地浪 侪 是 湿 个 。
    en: It's raining outside and the ground is wet everywhere.
  - hanzi: 现在 去 机场 来勿及 了 。
    en: It's too late to go to the airport now.
  fill:
  - hanzi: ＿ 吃 ， 汤 要 冷脱 了 。
    en: Eat up quickly, the soup is going cold.
    answer: 豪燥
  - hanzi: 出去 个 辰光 ， 拿 灯 ＿ 。
    en: Turn off the light when you go out.
    answer: 关脱
  - hanzi: 马路 浪 车子 多 ， 侬 要 ＿ 。
    en: There are a lot of cars in the street, be careful.
    answer: 小心
  say:
  - hanzi: 明朝 天气 哪能 ？
    en: What's the weather like tomorrow?
  - hanzi: 今朝 外头 三十 度 。
    en: It's thirty degrees outside today.
  - hanzi: 火车 要 开 快 了 。
    en: The train is about to leave.
