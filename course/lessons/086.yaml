exercises:
  translate:
  - hanzi: 今朝 阴天 ， 侬 带 把 洋伞 。
    en: 'It''s overcast today: take an umbrella.'
  - hanzi: 菜 侪 吃光 了 。
    en: The food is all eaten.
  - hanzi: 屋里 老 闷 ， 开 开 窗 。
    en: 'It''s very stuffy in here: open the window.'
  fill:
  - hanzi: 伊 一 到 屋里 ＿ 困 了 。
    en: As soon as he got home he went to sleep.
    answer: 就
  - hanzi: 夜里 有 ＿ ， 咬 了 我 交关 只 包 。
    en: 'There were mosquitoes last night: they bit me all over.'
    answer: 蚊子
  - hanzi: 今朝 热 ＿ ！
    en: It's terribly hot today!
    answer: 煞根
  say:
  - hanzi: 出 黄梅 了 。
    en: The plum rain is over.
  - hanzi: 我 欢喜 秋天 。
    en: I like autumn.
  - hanzi: 鞋子 湿 了 。
    en: My shoes are wet.
