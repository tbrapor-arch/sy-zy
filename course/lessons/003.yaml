# Lesson schema: see course/README.md. hanzi = words separated by spaces (one space = one sandhi domain);
# a word can force its reading with IPA + Chao tones: 新[ɕin53], 法国人[fᴀʔ55_koʔ55_ȵin13].
id: 3
title:
  en: How much?
  hanzi: 几钿 ？
review: false
setting: >-
  Saturday at the wet market (菜场) round the corner. Sam stops at a fruit stall.
dialogue:
- n: 1
  speaker: Sam
  hanzi: 阿姨 ， 搿个 几钿 ？
  en: Auntie, how much is this?
  lit: auntie, this how-much-money?
- n: 2
  speaker: 阿姨
  hanzi: 苹果 啊 ？ 十二 块 一 斤[ʨin53] 。
  en: The apples? Twelve yuan a jin.
- n: 3
  speaker: Sam
  hanzi: 忒 贵 了 ！ 便宜 一眼 好 伐 ？
  en: That's too expensive! A bit cheaper, OK?
  lit: too dear (now)! cheap a-bit good (question)?
- n: 4
  speaker: 阿姨
  hanzi: 侬 买 两 斤[ʨin53] ， 廿 块 。
  en: Buy two jin and it's twenty.
- n: 5
  speaker: Sam
  hanzi: 好个 。 再[ʦᴇ34] 要 一眼 葱 。
  en: OK. And a bit of spring onion too.
  lit: good. also want a-bit spring-onion
- n: 6
  speaker: 阿姨
  hanzi: 葱 拨 侬 ， 勿 要 铜钿 。
  en: The onions are for you, no charge.
  lit: spring-onion give you, not want money
- n: 7
  speaker: Sam
  hanzi: 谢谢 侬 ！ 阿姨 侬 老 好 个 。
  en: Thank you! You're very kind.
  lit: thank you! auntie you very good (really)
- n: 8
  speaker: 阿姨
  hanzi: 覅客气 。 下趟 再[ʦᴇ34] 来 ！
  en: Don't mention it. Come again!
  lit: don't-be-polite. next-time again come!
notes:
- ref: 1
  text: >-
    几钿 ci-di is "how much money", the question you will ask most at a market. For "how many" of anything else, use
    几 with a measure word: 几只, 几斤.
- ref: 2
  text: >-
    A 斤 is half a kilo, the unit for fruit and vegetables at Chinese markets. 块 is "yuan" when you count money.
- ref: 3
  text: >-
    忒 theq is "too (much)": 忒贵 too expensive, 忒烫 too hot. 好伐 at the end of a request softens it: "…, all right?"
- ref: 4
  text: >-
    廿 gnie is "twenty", one syllable. Shanghainese counts 十, 十一 … 十九, 廿, 廿一 … and then 三十 for thirty.
- ref: 6
  text: >-
    拨 peq is "to give" (Mandarin 给), and also "to, for" before a person. 铜钿 is "money" (Mandarin 钱); 钞票 is another
    everyday word for it.
- ref: 7
  text: >-
    The polite form is 谢谢侬 "thank you" (lit. thank you), or 谢谢 alone.
- ref: 8
  text: >-
    覅 is a single syllable made from 勿 + 要: "don't". So 覅客气 is "don't be polite" = "you're welcome". 下趟 is "next
    time" (Mandarin 下次).
exercises:
  translate:
  - hanzi: 葱 几钿 一 斤 ？
    en: How much is a jin of spring onions?
  - hanzi: 苹果 勿 贵 ， 我 买 四 斤 。
    en: The apples aren't expensive, I'll buy four jin.
  - hanzi: 阿姨 ， 铜钿 拨 侬 。
    en: Auntie, here's the money.
  fill:
  - hanzi: 搿个 苹果 ＿ ？
    en: How much are these apples?
    answer: 几钿
  - hanzi: 廿 块 忒 贵 了 ， ＿ 一眼 好 伐 ？
    en: Twenty is too much, a bit cheaper, OK?
    answer: 便宜
  - hanzi: 我 ＿ 两 斤 苹果 。
    en: I'll buy two jin of apples.
    answer: 买
  say:
  - hanzi: 下趟 再 买 。
    en: I'll buy some next time.
  - hanzi: 十二 块 忒 贵 了 。
    en: Twelve yuan is too expensive.
  - hanzi: 再 要 一 斤 苹果 。
    en: One more jin of apples, please.
