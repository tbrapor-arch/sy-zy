exercises:
  translate:
  - hanzi: 外婆 生毛病 了 ， 我 要 去 望望 伊 。
    en: Grandma is ill, I must go and see her.
  - hanzi: 医生 讲 我 个 病 勿 严重 。
    en: The doctor says my illness isn't serious.
  - hanzi: 门 开 辣海 ， 侬 自家 进来 。
    en: The door is open, come in by yourself.
  fill:
  - hanzi: 侬 覅 ＿ ， 伊 明朝 就 好 转去 了 。
    en: Don't worry, he can go home tomorrow.
    answer: 担心
  - hanzi: 小囡 困 ＿ ， 侬 声音 轻 一眼 。
    en: The child is asleep, keep your voice down.
    answer: 辣海
  - hanzi: 伊 腿 ＿ 了 ， 一 个 月 勿 好 上班 。
    en: He has broken his leg and can't go to work for a month.
    answer: 骨折
  say:
  - hanzi: 侬 要 多 休息 。
    en: You need to rest more.
  - hanzi: 医院 辣 阿里搭 ？
    en: Where is the hospital?
  - hanzi: 我 买 了 一眼 水果 拨 侬 。
    en: I've bought you a bit of fruit.
