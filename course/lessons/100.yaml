exercises:
  translate:
  - hanzi: 搿 本 小说 我 看 了 一半 。
    en: I've read half of this novel.
  - hanzi: 原来 侬 也 是 上海 人 ！
    en: So you're from Shanghai too!
  - hanzi: 搿抢里 我 老 忙 个 。
    en: I'm very busy these days.
  fill:
  - hanzi: 侬 ＿ 书 ， 看 第 一 页 。
    en: Open the book and look at the first page.
    answer: 翻开
  - hanzi: 搿 个 字 个 ＿ 搭 搿个 一样 。
    en: This word is read the same as 搿个.
    answer: 读法
  - hanzi: 我 到 外婆 ＿ 去 。
    en: I'm going to Granny's.
    answer: 海头
  say:
  - hanzi: 我 欢喜 看 小说 。
    en: I love reading novels.
  - hanzi: 侬 读 ， 我 听 。
    en: You read, I'll listen.
  - hanzi: 又 是 新 个 一 页 。
    en: It's a new page again.
