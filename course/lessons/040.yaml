exercises:
  translate:
  - hanzi: 伊 一面 吃 夜饭 ， 一面 讲 闲话 。
    en: She talks while she has dinner.
  - hanzi: 搿 条 马路 浪 个 树 侪 是 梧桐树 。
    en: The trees on this road are all plane trees.
  - hanzi: 侬 着 搿 件 衬衫 交关 有 腔调 。
    en: You look really stylish in that shirt.
  fill:
  - hanzi: 侬 想 吃 啥 ？ ＿ ， 侬 点 好 了 。
    en: What would you like? Anything, you order.
    answer: 随便
  - hanzi: 侬 ＿ 一 望 ， 外头 落雨 了 伐 ？
    en: Have a look, is it raining outside?
    answer: 望
  - hanzi: 搿 个 字 是 啥个 ＿ ？
    en: What does this character mean?
    answer: 意思
  say:
  - hanzi: 阿拉 去 荡马路 好 伐 ？
    en: Shall we go for a stroll?
  - hanzi: 我 帮 侬 拍 张 照片 。
    en: I'll take a photo of you.
  - hanzi: 搿 种 洋房 老 漂亮 个 。
    en: These Western-style houses are very beautiful.
