exercises:
  translate:
  - hanzi: 侬 拿 菜 汏 清爽 ， 再 斩 开 。
    en: Wash the vegetables clean, then chop them up.
  - hanzi: 冬天 外头 冰冰冷 ， 侬 多 着 一眼 。
    en: 'It''s ice-cold outside in winter: wear more.'
  - hanzi: 慢慢叫 吃 ， 汤 老 烫 个 。
    en: Eat slowly, the soup is very hot.
  fill:
  - hanzi: 肉 烧 ＿ 了 ， 好 吃 了 。
    en: The meat's done, you can eat now.
    answer: 熟
  - hanzi: 搿 只[ʦᴀʔ55] 菜 要 用 小 ＿ 烧 。
    en: This dish needs low heat.
    answer: 火
  - hanzi: 侬 ＿ 讲 ， 小人 辣 困 。
    en: Speak gently, the child is asleep.
    answer: 轻轻叫
  say:
  - hanzi: 我 欢喜 吃 红烧肉 。
    en: I love red-braised pork.
  - hanzi: 一 荤 一 素 ， 够 了 。
    en: 'One meat, one vegetable: that''s enough.'
  - hanzi: 侬 尝尝 看 味道 。
    en: Taste it and see.
