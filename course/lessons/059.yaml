exercises:
  translate:
  - hanzi: 搿 件 衬衫 打 对折 ， 一百 块 左右 。
    en: This shirt is half price, about a hundred yuan.
  - hanzi: 现在 菜场 个 菜 侪 涨价 了 。
    en: Everything at the market has gone up in price.
  - hanzi: 伊 包 里 一塌刮子 只 有 两 张 票子 。
    en: He has only two banknotes in his bag all told.
  fill:
  - hanzi: 搿 只[ʦᴀʔ55] 西瓜 ＿ 洋钿 一 斤 ？
    en: How much a jin is this watermelon?
    answer: 几化
  - hanzi: 小店 夜里向 八 点钟 ＿ 。
    en: The little shop closes at eight at night.
    answer: 打烊
  - hanzi: 搿 只[ʦᴀʔ55] 包 勿 ＿ 八百 块 。
    en: This bag isn't worth eight hundred yuan.
    answer: 值
  say:
  - hanzi: 勿要 忒 贵 噢 ！
    en: That's far too expensive!
  - hanzi: 搿 只[ʦᴀʔ55] 包 卖相 老 好 个 。
    en: This bag looks really good.
  - hanzi: 今朝 生意 哪能 ？
    en: How's business today?
