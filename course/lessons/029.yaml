exercises:
  translate:
  - hanzi: 㑚 明朝 啥辰光 到 ？
    en: When do you all arrive tomorrow?
  - hanzi: 我 勿 认得 埃 个 小人 。
    en: I don't know that child.
  - hanzi: 原来 侬 是 伊 个 朋友 ！
    en: So you're his friend!
  fill:
  - hanzi: 侬 夜到 几 点钟 ＿ ？
    en: What time do you go to bed?
    answer: 困觉
  - hanzi: 我 礼拜六 到 机场 去 ＿ 阿姐 。
    en: I'm going to the airport on Saturday to meet my sister.
    answer: 接
  - hanzi: 今朝 公司 里 ＿ 了 。
    en: The office was terribly busy today.
    answer: 忙煞
  say:
  - hanzi: 侬 认得 路 伐 ？
    en: Do you know the way?
  - hanzi: 㑚 侪 是 法国人 伐 ？
    en: Are you all French?
  - hanzi: 今朝 勿 去 了 ， 明朝 再讲 。
    en: Let's not go today, we'll see tomorrow.
