exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 插头 勿 灵光 了 。
    en: This plug doesn't work any more.
  - hanzi: 电话 修 是 修 得 好 ， 必过 要 一 个 礼拜 。
    en: The phone can be repaired all right, but it'll take a week.
  - hanzi: 搿 件 衬衫 打八折 ， 交关 合算 。
    en: This shirt is 20% off, very good value.
  fill:
  - hanzi: 搿 种 事体 我 ＿ ， 侬 来 帮 我 。
    en: I can't manage this kind of thing, can you help me?
    answer: 弄勿来
  - hanzi: 外头 是 啥个 ＿ ？ 交关 吵 。
    en: What's that noise outside? It's very loud.
    answer: 声音
  - hanzi: 苹果 个 ＿ 写 辣 高头 。
    en: The price of the apples is written on top.
    answer: 价钿
  say:
  - hanzi: 洗衣机 修 得 好 伐 ？
    en: Can the washing machine be fixed?
  - hanzi: 伞 我 留 拨 侬 。
    en: I'll leave the umbrella for you.
  - hanzi: 门口 个 机器 勿 灵光 了 。
    en: The machine at the door doesn't work any more.
