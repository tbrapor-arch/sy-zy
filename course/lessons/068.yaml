exercises:
  translate:
  - hanzi: 要是 明朝 落雨 ， 阿拉 就 勿 去 了 。
    en: If it rains tomorrow we won't go.
  - hanzi: 既然 侬 勿 适意 ， 今朝 就 覅 上班 了 。
    en: Since you're not well, don't go to work today.
  - hanzi: 搿 只[ʦᴀʔ55] 菜 忒 淡 ， 摆 一眼 盐 。
    en: 'This dish is too bland: add a bit of salt.'
  fill:
  - hanzi: 已经 十 点 了 ， 伊 ＿ 勿 来 了 。
    en: 'It''s already ten: I''m afraid he isn''t coming.'
    answer: 恐怕
  - hanzi: ＿ 侬 有 辰光 ， 一道 去 吃 饭 。
    en: If you have time, let's go and eat together.
    answer: 要是
  - hanzi: 中药 老 ＿ 个 。
    en: Chinese medicine is very bitter.
    answer: 苦
  say:
  - hanzi: 我 喉咙 痒 。
    en: My throat itches.
  - hanzi: 侬 伤风 了 伐 ？
    en: Have you caught a cold?
  - hanzi: 我 浑身 呒没 力道 。
    en: I've no strength at all.
