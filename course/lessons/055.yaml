exercises:
  translate:
  - hanzi: 我 搭 老板 讲 过 了 ， 伊 同意 个 。
    en: I've spoken to the boss, he agrees.
  - hanzi: 伊 大学 毕业 以后 就 到 上海 来 工作 。
    en: After graduating from university she came to work in Shanghai.
  - hanzi: 搿 个 机会 老 重要 个 ， 侬 要 努力 。
    en: This chance is very important, you must work hard.
  fill:
  - hanzi: 下 个 礼拜 我 要 到 苏州 ＿ 。
    en: Next week I'm going to Suzhou on business.
    answer: 出差
  - hanzi: 侬 有 啥 ＿ ， 侪 好 问 我 。
    en: If you have any questions, you can ask me.
    answer: 问题
  - hanzi: 今朝 勿 加班 ， 六 点钟 就 ＿ 。
    en: 'No overtime today: I finish at six.'
    answer: 下班
  say:
  - hanzi: 我 希望 侬 成功 。
    en: I hope you succeed.
  - hanzi: 侬 学 个 是 啥 专业 ？
    en: What did you study?
  - hanzi: 办公室 里 呒没 人 。
    en: There's nobody in the office.
