exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 鱼 要 用 大 火 蒸 。
    en: This fish needs steaming on a high heat.
  - hanzi: 伊 一记头 吃 了 三 碗 饭 。
    en: He ate three bowls of rice in one go.
  - hanzi: 水 滚 了 ， 侬 放 面 下去 。
    en: The water's boiling, put the noodles in.
  fill:
  - hanzi: 春天 个 青菜 老 ＿ 个 。
    en: Spring greens are very tender.
    answer: 嫩
  - hanzi: 我 ＿ 饿煞 了 ， 阿拉 去 吃 面 。
    en: I'm starving, let's go and have noodles.
    answer: 肚皮
  - hanzi: 汤 里 ＿ 放 多 了 ， 忒 咸 了 。
    en: There's too much salt in the soup, it's too salty.
    answer: 盐
  say:
  - hanzi: 我 闻 到 红烧肉 个 味道 了 。
    en: I can smell red-braised pork.
  - hanzi: 汤 要 用 小 火 笃 。
    en: Soup has to simmer on a low heat.
  - hanzi: 侬 当心 刀 ！
    en: Careful with the knife!
