exercises:
  translate:
  - hanzi: 伊 面孔 红 了 ， 有 一眼 难为情 。
    en: She blushed, a bit embarrassed.
  - hanzi: 老底子 弄堂 里 个 人 侪 认得 个 。
    en: In the old days everyone in the lane knew each other.
  - hanzi: 我 已经 吃 过 夜饭 了 。
    en: I've already had dinner.
  fill:
  - hanzi: 阿拉 坐 辣 弄堂口 ＿ 。
    en: We're sitting at the mouth of the lane, chatting.
    answer: 嘎讪胡
  - hanzi: 侬 覅 吹 ＿ ， 侬 自家 会 啥 ？
    en: Stop boasting, what can you actually do?
    answer: 牛皮
  - hanzi: 伊 老 ＿ 个 ， 看见 侬 有 事体 就 转去 了 。
    en: 'She is very tactful: seeing you were busy, she went home.'
    answer: 识相
  say:
  - hanzi: 搿 个 讲法 啥个 意思 ？
    en: What does this expression mean?
  - hanzi: 昨日 我 碰着 小张 了 。
    en: I ran into Xiao Zhang yesterday.
  - hanzi: 啊呀 ， 我 忘记 带 钥匙 了 ！
    en: Oh no, I've forgotten my keys!
