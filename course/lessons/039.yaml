exercises:
  translate:
  - hanzi: 伊 话 伊 明朝 勿 来 了 。
    en: He says he isn't coming tomorrow.
  - hanzi: 阿拉 阿姐 辣 大学 里 教 英文 。
    en: My big sister teaches English at a university.
  - hanzi: 附近 有 地铁站 伐 ？
    en: Is there a metro station nearby?
  fill:
  - hanzi: 侬 ＿ 了 ， 就是 搿 只[ʦᴀʔ55] 。
    en: You're right, it's this one.
    answer: 对
  - hanzi: 侬 姆妈 叫 啥 ＿ ？
    en: What's your mother's name?
    answer: 名字
  - hanzi: 伊 辣 大学 里 ＿ ， 学 英文 个 。
    en: She studies English at university.
    answer: 读书
  say:
  - hanzi: 我 辣 学 上海闲话 。
    en: I'm learning Shanghainese.
  - hanzi: 阿拉 加 个 微信 好 伐 ？
    en: Shall we add each other on WeChat?
  - hanzi: 侬 搿 个 主意 老 好 。
    en: That's a very good idea of yours.
