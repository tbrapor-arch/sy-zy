exercises:
  translate:
  - hanzi: 伊 一向 困 得 老 早 。
    en: He has always gone to bed very early.
  - hanzi: 虽然 落雨 ， 但是 伊 还是 来 了 。
    en: Although it was raining, he still came.
  - hanzi: 我 有辰光 也 想 屋里 人 。
    en: Sometimes I miss my family too.
  fill:
  - hanzi: 伊 勿 ＿ 听 我 个 闲话 。
    en: He isn't willing to listen to me.
    answer: 肯
  - hanzi: 吃 了 药 ， 咳嗽 ＿ 重 了 。
    en: After the medicine the cough got worse instead.
    answer: 反而
  - hanzi: 四十 年 个 ＿ ， 老 难 改 个 。
    en: A forty-year habit is very hard to break.
    answer: 习惯
  say:
  - hanzi: 我 勿 吃 香烟 。
    en: I don't smoke.
  - hanzi: 侬 真 了勿起 ！
    en: You're amazing!
  - hanzi: 我 勿 舍得 。
    en: I can't bear to part with it.
