exercises:
  translate:
  - hanzi: 搿 件 事体 搭 我 勿 搭界 。
    en: This has nothing to do with me.
  - hanzi: 地铁 浪 人 多 ， 覅 推 。
    en: There are a lot of people on the metro, don't push.
  - hanzi: 伊 凶 是 凶 ， 必过 心 老 好 。
    en: She can be fierce, but she has a good heart.
  fill:
  - hanzi: 菜场 门口 人 交关 多 ， 侪 辣 ＿ 。
    en: There are lots of people at the market entrance, all queuing.
    answer: 排队
  - hanzi: 侬 ＿ 我 拎 一 只[ʦᴀʔ55] 包 好 伐 ？
    en: Could you help me carry a bag?
    answer: 帮
  - hanzi: 今朝 落雨 ， 钥匙 又 落脱 了 ， 真 ＿ 。
    en: It rained today and I lost my keys again, so unlucky.
    answer: 倒霉
  say:
  - hanzi: 喂 ， 侬 是 小李 伐 ？
    en: Hello, is that Xiao Li?
  - hanzi: 侬 覅 管 闲事 。
    en: Mind your own business.
  - hanzi: 排队 ， 覅 插队 ！
    en: Queue up, no cutting in!
