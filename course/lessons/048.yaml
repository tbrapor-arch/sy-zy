exercises:
  translate:
  - hanzi: 伊 一直 辣 屋里 等 侬 。
    en: She's been waiting for you at home all along.
  - hanzi: 我 讲 错 了 ， 勿好意思 。
    en: I said it wrong, sorry.
  - hanzi: 伊 讲 伊 后悔 了 ， 侬 就 原谅 伊 。
    en: He says he regrets it, so forgive him.
  fill:
  - hanzi: 侬 打 错 电话 了 ？ ＿ ， 再 打 一 趟 。
    en: You dialled the wrong number? Never mind, call again.
    answer: 算了
  - hanzi: 搿 部 洗衣机 已经 呒没 ＿ 了 。
    en: This washing machine is no use any more.
    answer: 用场
  - hanzi: 我 勿 是 搿 个 意思 ， 侬 ＿ 了 。
    en: That's not what I meant, you've misunderstood.
    answer: 误会
  say:
  - hanzi: 对勿起 ， 是 我 勿 对 。
    en: Sorry, it was my fault.
  - hanzi: 我 保证 明朝 勿 迟到 。
    en: I promise I won't be late tomorrow.
  - hanzi: 昨日 夜里 我 困勿着 。
    en: I couldn't sleep last night.
