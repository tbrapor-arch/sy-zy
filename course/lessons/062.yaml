exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 歌 真叫 好听 。
    en: This song is really lovely.
  - hanzi: 我 礼拜天 平常 汏 衣裳 、 买 菜 咾啥 。
    en: On Sundays I usually do the washing, buy food and so on.
  - hanzi: 电影 结束 个 辰光 ， 大家 侪 拍手 。
    en: When the film ended, everybody clapped.
  fill:
  - hanzi: 今朝 热 得 ＿ ， 我 勿 想 出去 。
    en: It's tremendously hot today, I don't want to go out.
    answer: 勿得了
  - hanzi: 伊 讲 闲话 ＿ 多 ， 大家 侪 欢喜 听 。
    en: He is full of jokes when he talks; everyone likes listening to him.
    answer: 噱头
  - hanzi: 礼拜六 夜里向 有 ＿ ， 侬 去 听 伐 ？
    en: There's a concert on Saturday night. Are you going?
    answer: 音乐会
  say:
  - hanzi: 搿 只[ʦᴀʔ55] 戏 有趣 伐 ？
    en: Is this show funny?
  - hanzi: 我 欢喜 听 音乐 。
    en: I like listening to music.
  - hanzi: 阿拉 个 位子 辣 阿里搭 ？
    en: Where are our seats?
