- hanzi: 肯
  en: to be willing to
- hanzi: 虽然
  en: although
- hanzi: 戒脱
  en: to give up (a habit)
- hanzi: 反而
  en: instead, on the contrary
- hanzi: 嫌
  en: to complain it is too …
- hanzi: 倒是
  en: actually, for my part
- hanzi: 改
  en: to change
- hanzi: 了勿起
  en: amazing
- hanzi: 习惯
  en: habit
- hanzi: 舍得
