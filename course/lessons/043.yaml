exercises:
  translate:
  - hanzi: 搿 件 外套 比 埃 件 重 交关 。
    en: This jacket is a lot heavier than that one.
  - hanzi: 伊 个 上海闲话 越 来 越 好 了 。
    en: His Shanghainese is getting better and better.
  - hanzi: 侬 搿 只[ʦᴀʔ55] 包 用 了 十 年 ， 还 勿 推扳 。
    en: You've used that bag ten years and it's still not bad.
  fill:
  - hanzi: 苏州 个 面 搭 上海 个 面 ＿ 伐 ？
    en: Are Suzhou noodles different from Shanghai ones?
    answer: 两样
  - hanzi: 坐 汽车 ＿ 坐 火车 快 。
    en: Going by coach isn't as fast as the train.
    answer: 勿及
  - hanzi: 我 欢喜 搿 个 ＿ ， 蓝 个 。
    en: I like this colour, the blue one.
    answer: 颜色
  say:
  - hanzi: 我 个 手机 比 侬 个 旧 。
    en: My phone is older than yours.
  - hanzi: 搿 部 手机 质量 好 伐 ？
    en: Is this phone good quality?
  - hanzi: 旧 衣裳 我 舍勿得 掼 。
    en: I can't bear to throw away old clothes.
