exercises:
  translate:
  - hanzi: 只要 侬 来 ， 我 就 开心 。
    en: As long as you come, I'm happy.
  - hanzi: 除脱 伊 ， 大家 侪 来 了 。
    en: Everyone came except him.
  - hanzi: 勿管 落雨 勿 落雨 ， 我 侪 去 。
    en: Rain or no rain, I'm going.
  fill:
  - hanzi: 快 点 走 ， ＿ 来勿及 了 。
    en: Hurry up, otherwise we'll be late.
    answer: 否则
  - hanzi: 我 还 要 ＿ 一 下 。
    en: I need to think it over a bit more.
    answer: 考虑
  - hanzi: 雨 落 得 介 大 ， 阿拉 ＿ 屋里 吃 饭 。
    en: 'It''s pouring: we might as well eat at home.'
    answer: 索性
  say:
  - hanzi: 恭喜 侬 ！
    en: Congratulations!
  - hanzi: 我 已经 决定 了 。
    en: I've made up my mind.
  - hanzi: 侬 打算 出国 伐 ？
    en: Are you planning to go abroad?
