exercises:
  translate:
  - hanzi: 吃 了 夜饭 再 去 看 电影 。
    en: We'll have dinner and then go to the cinema.
  - hanzi: 侬 看牢 小人 ， 覅 拨 伊 跑 出去 。
    en: Keep an eye on the child, don't let him run out.
  - hanzi: 落雨 天 路 滑 ， 骑 脚踏车 当心 。
    en: 'The roads are slippery when it rains: careful on the bike.'
  fill:
  - hanzi: 侬 ＿ 我 走 ， 覅 走 开 。
    en: Stay right behind me, don't wander off.
    answer: 跟牢
  - hanzi: 去 公司 ＿ 买 一眼 水果 。
    en: Buy some fruit on your way to the office.
    answer: 顺带便
  - hanzi: 前头 ＿ ， 慢 一眼 。
    en: 'There is a bend ahead: slow down.'
    answer: 转弯
  say:
  - hanzi: 侬 会 骑 脚踏车 伐 ？
    en: Can you ride a bike?
  - hanzi: 我 欢喜 看 小说 。
    en: I like reading novels.
  - hanzi: 黄浦江 对面 就是 浦东 。
    en: Pudong is just across the Huangpu.
