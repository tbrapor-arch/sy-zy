exercises:
  translate:
  - hanzi: 旧年 我 去 了 一 趟 北京 。
    en: Last year I went to Beijing once.
  - hanzi: 据说 后日 要 落雪 。
    en: They say it's going to snow the day after tomorrow.
  - hanzi: 上海 个 外国 人 越来越 多 。
    en: There are more and more foreigners in Shanghai.
  fill:
  - hanzi: 前头 ＿ 了 啥 事体 ？
    en: What happened up ahead?
    answer: 发生
  - hanzi: 伊 今朝 ＿ 勿 来 了 。
    en: He probably won't come today.
    answer: 可能
  - hanzi: 我 ＿ 侬 讲 得 对 。
    en: I think you're right.
    answer: 认为
  say:
  - hanzi: 夏天 上海 老 热 个 。
    en: Shanghai is very hot in summer.
  - hanzi: 侬 看 新闻 伐 ？
    en: Do you watch the news?
  - hanzi: 明朝会 ！
    en: See you tomorrow!
