exercises:
  translate:
  - hanzi: 伊 个 绰号 叫 长脚 。
    en: His nickname is Long Legs.
  - hanzi: 夏天 夜里 ， 弄堂 里 老 闹猛 个 。
    en: On summer nights the lane is very lively.
  - hanzi: 侬 屋里 物事 摆 得 一天世界 。
    en: Your things are strewn all over the flat.
  fill:
  - hanzi: 伊 又 矮 又 ＿ ， 像 只[ʦᴀʔ55] 柏油桶 。
    en: He's short and round, like a tar barrel.
    answer: 胖
  - hanzi: 我 个 脚踏车 拨 人 ＿ 了 。
    en: My bike has been stolen.
    answer: 偷
  - hanzi: 伊 讲 闲话 ＿ 老 多 。
    en: He has plenty of stories.
    answer: 花头
  say:
  - hanzi: 侬 有 绰号 伐 ？
    en: Do you have a nickname?
  - hanzi: 今朝 弄堂 里 老 闹猛 。
    en: The lane is very lively today.
  - hanzi: 覅 骂 人 。
    en: Don't call people names.
