# Lesson schema: see course/README.md. hanzi = words separated by spaces (one space = one sandhi domain);
# a word can force its reading with IPA + Chao tones: 新[ɕin53], 法国人[fᴀʔ55_koʔ55_ȵin13].
id: 6
title:
  en: A Sunday out
  hanzi: 礼拜天 白相
review: false
setting: >-
  Friday evening. Sam phones Xiao Li, a colleague who grew up in Hongkou.
dialogue:
- n: 1
  speaker: Sam
  hanzi: 小李[ɕiɔ34_li13] ， 礼拜天 侬 空 伐 ？
  en: Xiao Li, are you free on Sunday?
  lit: Little-Li, Sunday you free (question)?
- n: 2
  speaker: 小李
  hanzi: 空 个 。 做啥 ？
  en: Yes, I'm free. Why?
  lit: free (I am). do-what?
- n: 3
  speaker: Sam
  hanzi: 阿拉 一道 去 豫园[ɦy13_ɦyø13] 白相 好 伐 ？
  en: Shall we go to Yuyuan together?
  lit: we together go Yuyuan play good (question)?
- n: 4
  speaker: 小李
  hanzi: 好个 ！ 几点钟 ？
  en: Sure! What time?
- n: 5
  speaker: Sam
  hanzi: 早浪 十 点钟 ， 我 辣 地铁站 等 侬 。
  en: Ten in the morning. I'll wait for you at the metro station.
- n: 6
  speaker: 小李
  hanzi: 好个 。 阿拉 中饭 吃 小笼 ！
  en: OK. Let's have soup dumplings for lunch!
- n: 7
  speaker: Sam
  hanzi: 灵 个 ！ 我 老 欢喜 吃 小笼 个 。
  en: Great! I love soup dumplings.
  lit: great (it is)! I very like eat soup-dumpling (really)
- n: 8
  speaker: 小李
  hanzi: 覅 忘记 带 钞票 。
  en: Don't forget to bring money.
- n: 9
  speaker: Sam
  hanzi: 晓得 了 ， 礼拜天 见[ʨi34] ！
  en: Got it, see you Sunday!
  lit: know (now), Sunday see!
notes:
- ref: 1
  text: >-
    空 khon, said with the departing tone, is "free, not busy". 礼拜天 is Sunday: Shanghainese counts the week in 礼拜
    (Mandarin 星期): 礼拜一 Monday … 礼拜六 Saturday.
- ref: 2
  text: >-
    做啥 "do what?" is the usual way to ask "why? what for?". It is softer than 为啥 "why".
- ref: 3
  text: >-
    阿拉 here includes the person you are talking to: "let's". 一道 is "together" (Mandarin 一起). 豫园 is the old garden
    and bazaar in the south of the city.
- ref: 5
  text: >-
    早浪 is "in the morning". Time comes before the verb: 早浪十点钟 "(at) ten in the morning". 辣 + place again: 辣地铁站 "at
    the metro station".
- ref: 7
  text: >-
    灵 lin is "great, works well": 灵个！ "great!". 欢喜 is "to like" (Mandarin 喜欢, the two characters in the other order).
- ref: 8
  text: >-
    覅 "don't" again (lesson 3). 带 is "to bring", 钞票 "money".
- ref: 9
  text: >-
    晓得了 "(I) know (now)" = "got it". 晓得 is "to know" (Mandarin 知道).
exercises:
  translate:
  - hanzi: 小李 礼拜天 勿 空 。
    en: Xiao Li isn't free on Sunday.
  - hanzi: 阿拉 一道 去 吃 小笼 好 伐 ？
    en: Shall we go and have soup dumplings together?
  - hanzi: 我 辣 豫园 等 侬 。
    en: I'll wait for you at Yuyuan.
  fill:
  - hanzi: 侬 欢喜 吃 生煎 ＿ ？
    en: Do you like pan-fried buns?
    answer: 伐
  - hanzi: 早浪 七 ＿ ， 我 辣 屋里 等 侬 。
    en: Seven in the morning, I'll wait for you at home.
    answer: 点钟
  - hanzi: 我 ＿ 了 ， 十 点钟 见 。
    en: Got it, see you at ten.
    answer: 晓得
  say:
  - hanzi: 侬 做啥 去 豫园 ？
    en: Why are you going to Yuyuan?
  - hanzi: 覅 忘记 带 照片 。
    en: Don't forget to bring the photos.
  - hanzi: 我 老 欢喜 豫园 。
    en: I really like Yuyuan.
