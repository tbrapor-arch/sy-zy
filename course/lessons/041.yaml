exercises:
  translate:
  - hanzi: 小人 哭 了 ， 伊 寻勿着 姆妈 了 。
    en: The child is crying, he can't find his mum.
  - hanzi: 伊 脾气 老 好 ， 一眼 也 勿 会 动气 。
    en: He's very easy-going, he never gets angry at all.
  - hanzi: 我 勿 懂 侬 讲 个 意思 。
    en: I don't understand what you mean.
  fill:
  - hanzi: 侬 等 ＿ ， 我 马上 来 。
    en: Wait a moment, I'm coming right away.
    answer: 一歇
  - hanzi: 礼拜天 我 ＿ 外婆 去 苏州 。
    en: On Sunday I'm going to Suzhou with Grandma (to keep her company).
    answer: 陪
  - hanzi: 侬 覅 ＿ ， 我 勿是 讲 侬 。
    en: Don't get upset, I wasn't talking about you.
    answer: 动气
  say:
  - hanzi: 侬 哪能 了 ？ 啥 事体 ？
    en: What's the matter? What happened?
  - hanzi: 我 今朝 心里 勿 适意 。
    en: I don't feel right today.
  - hanzi: 阿拉 去 吃 杯 茶 。
    en: Let's go for a cup of tea.
