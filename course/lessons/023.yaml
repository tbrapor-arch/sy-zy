- hanzi: 总归
  en: always; in any case
- hanzi: 到底
  en: after all; (in a question) on earth
exercises:
  translate:
  - hanzi: 侬 蹲 辣 啥地方 ？
    en: Where do you live?
  - hanzi: 伞 我 落脱 辣 地铁 里头 了 。
    en: I left my umbrella on the metro.
  - hanzi: 外卖 勿 来 ， 只好 自家 烧 了 。
    en: The delivery isn't coming, so we'll have to cook ourselves.
  fill:
  - hanzi: 侬 包 里头 有 ＿ 物事 ？
    en: What have you got in your bag?
    answer: 啥个
  - hanzi: 钥匙 寻 了 半 个 钟头 ， 还 ＿ 。
    en: I've looked for the key for half an hour and still can't find it.
    answer: 寻勿着
  - hanzi: 伊 是 ＿ 新 来 个 ？
    en: Is he the new one?
    answer: 是勿是
  say:
  - hanzi: 我 勿晓得 伊 蹲 辣 啥地方 。
    en: I don't know where he lives.
  - hanzi: 钥匙 寻着 了 伐 ？
    en: Have you found the keys?
  - hanzi: 物事 侪 放 辣 包 里头 。
    en: Everything is in the bag.
