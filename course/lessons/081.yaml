exercises:
  translate:
  - hanzi: 因为 落雨 ， 所以 伊 勿 来 了 。
    en: Because it's raining, he isn't coming.
  - hanzi: 其实 伊 是 上海 人 ， 勿 是 苏州 人 。
    en: Actually she's from Shanghai, not Suzhou.
  - hanzi: 侬 讲 下去 ， 我 辣辣 听 。
    en: Go on, I'm listening.
  fill:
  - hanzi: 我 勿 ＿ 一 个 人 夜里 出去 。
    en: I don't dare go out alone at night.
    answer: 敢
  - hanzi: 伊 ＿ 勿 来 ， 阿拉 先 吃 。
    en: He's not coming anyway, let's eat.
    answer: 反正
  - hanzi: 搿 桩 事体 侬 搭 伊 ＿ 。
    en: Talk this over with her.
    answer: 商量
  say:
  - hanzi: 我 相信 侬 。
    en: I believe you.
  - hanzi: 侬 有 啥 打算 ？
    en: What are your plans?
  - hanzi: 怪勿得 伊 勿 开心 。
    en: No wonder he's unhappy.
