exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 碗 拨 伊 打破 了 。
    en: This bowl was broken by him.
  - hanzi: 我 根本 勿 晓得 搿 桩 事体 。
    en: I knew nothing at all about this.
  - hanzi: 侬 哪能 好 搿能 讲 ？
    en: How can you say that?
  fill:
  - hanzi: 伊 做 事体 老 ＿ ， 一眼 也 勿 错 。
    en: She works very carefully, without a single mistake.
    answer: 仔细
  - hanzi: 我 勿 是 ＿ 个 ， 对勿起 。
    en: I didn't do it on purpose, sorry.
    answer: 存心
  - hanzi: 侬 ＿ 伐 ？ 勿 满意 再 讲 。
    en: Are you satisfied? If not, say so.
    answer: 满意
  say:
  - hanzi: 我 要 投诉 。
    en: I want to make a complaint.
  - hanzi: 侬 讲 道理 好 伐 ？
    en: Be reasonable, will you?
  - hanzi: 实在 抱歉 。
    en: I'm terribly sorry.
