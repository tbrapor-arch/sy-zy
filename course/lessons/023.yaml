- hanzi: 里头
  en: inside, in
- hanzi: 是勿是
  en: is it that…? (question)
- hanzi: 落脱
  en: to lose, leave behind
- hanzi: 公司
  en: company, office
- hanzi: 勿晓得
  en: don't know
- hanzi: 房东
  en: landlord, landlady
- hanzi: 蹲
