# The 100 lessons (as Tsheh-tû's syllabus.yaml): title + what each one teaches. Lessons 1–28 are written; 29–100 are
# the plan, to adjust with `make coverage` (the most frequent words not taught yet) before each batch.
# Every 7th lesson is a review; the second wave starts at lesson 50.
