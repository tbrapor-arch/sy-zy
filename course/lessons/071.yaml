exercises:
  translate:
  - hanzi: 要末 今朝 去 ， 要末 明朝 去 ， 侬 讲 。
    en: 'Either today or tomorrow: you decide.'
  - hanzi: 伊 大概 礼拜六 出发 。
    en: He's probably setting off on Saturday.
  - hanzi: 飞机 票子 要 提前 订 。
    en: Plane tickets have to be booked in advance.
  fill:
  - hanzi: 侬 吃 茶 ＿ 吃 咖啡 ？
    en: Will you have tea or coffee?
    answer: 还是
  - hanzi: 明朝 我 乘 地铁 ＿ 乘 公交 去 。
    en: Tomorrow I'll go by metro or by bus.
    answer: 或者
  - hanzi: 侬 带 了 ＿ 伐 ？ 乘 高铁 要 用 个 。
    en: Have you got your ID card? You need it for the train.
    answer: 身份证
  say:
  - hanzi: 阿拉 国庆 出去 旅游 。
    en: We're going on a trip at National Day.
  - hanzi: 酒店 我 已经 订 好 了 。
    en: I've already booked the hotel.
  - hanzi: 杭州 我 从来 呒没 去 过 。
    en: I've never been to Hangzhou.
