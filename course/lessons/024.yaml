- hanzi: 开
  en: to open
- hanzi: 银行卡
  en: bank card
- hanzi: 护照
  en: passport
- hanzi: 存
  en: to deposit, save
- hanzi: 请
  en: please; to invite
- hanzi: 按
  en: to press
- hanzi: 密码
  en: password, PIN
- hanzi: 以后
  en: later, afterwards
- hanzi: 取
  en: to take out (money)
- hanzi: 用勿着
  en: no need
- hanzi: 机器
  en: machine
- hanzi: 介
  en: so, such
- hanzi: 便当
