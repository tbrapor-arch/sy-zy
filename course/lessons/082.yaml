exercises:
  translate:
  - hanzi: 饭 末 吃 饭 ， 覅 看 手机 。
    en: Eat your meal, stop looking at your phone.
  - hanzi: 礼拜天 我 欢喜 笃悠悠 吃 早饭 。
    en: On Sundays I like a leisurely breakfast.
  - hanzi: 搿 只[ʦᴀʔ55] 电影 我 看 了 两 遍 。
    en: I've seen this film twice.
  fill:
  - hanzi: 今朝 天 好 ， 阿拉 去 外滩 ＿ 。
    en: It's a nice day, let's go for a stroll on the Bund.
    answer: 兜兜
  - hanzi: 坐 辣 屋里 吃 茶 ， 真 ＿ 。
    en: 'Sitting at home drinking tea: so pleasant.'
    answer: 写意
  - hanzi: 搿搭 个 ＿ 老 好吃 个 。
    en: The snacks here are delicious.
    answer: 点心
  say:
  - hanzi: 阿拉 要 一 壶 茶 。
    en: We'd like a pot of tea.
  - hanzi: 侬 讲讲看 。
    en: Go on, tell me.
  - hanzi: 我 退休 了 ， 人 老 闲 。
    en: 'I''m retired: I have plenty of time.'
