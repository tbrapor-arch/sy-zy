exercises:
  translate:
  - hanzi: 钥匙 就 辣 台子 浪向 。
    en: The keys are right there on the table.
  - hanzi: 银行 辣 地铁站 对面 ， 小店 旁边 。
    en: The bank is opposite the metro station, next to the little shop.
  - hanzi: 侬 个 包 摆 辣 阿里搭 ？
    en: Where have you put your bag?
  fill:
  - hanzi: 垃圾 摆 辣 ＿ ， 我 等歇 去 倒 。
    en: Leave the rubbish by the door, I'll take it out in a moment.
    answer: 门口头
  - hanzi: 侬 立 辣 搿面 ， 我 立 辣 ＿ 。
    en: You stand on this side, I'll stand over there.
    answer: 伊面
  - hanzi: 物事 侪 辣 抽斗 ＿ 。
    en: Everything is inside the drawer.
    answer: 里向头
  say:
  - hanzi: 我 寻勿着 我 个 眼镜 了 。
    en: I can't find my glasses.
  - hanzi: 屋里向 冷 ， 外头 热 。
    en: It's cold indoors and hot outside.
  - hanzi: 镜子 底下头 有 一 只[ʦᴀʔ55] 抽斗 。
    en: There is a drawer under the mirror.
