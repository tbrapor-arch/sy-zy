exercises:
  translate:
  - hanzi: 先 吃 早饭 ， 再 去 上班 。
    en: First breakfast, then work.
  - hanzi: 我 一日天 侪 辣 屋里 。
    en: I was at home all day.
  - hanzi: 着末脚 ， 伊 还是 来 了 。
    en: In the end he came after all.
  fill:
  - hanzi: 伊 看 手机 要 ＿ 眼镜 。
    en: He needs glasses to read his phone.
    answer: 戴
  - hanzi: 吃 好 夜饭 ， 阿拉 去 公园 ＿ 。
    en: After dinner let's go for a walk in the park.
    answer: 散步
  - hanzi: ＿ ， 伊 到 摊头 浪 买 早点 。
    en: Next, he goes to the stall to buy breakfast.
    answer: 挨下来
  say:
  - hanzi: 我 日日 侪 早起 。
    en: I get up early every day.
  - hanzi: 侬 会 着 象棋 伐 ？
    en: Can you play Chinese chess?
  - hanzi: 伊 耳朵 勿大 灵 。
    en: He's a bit hard of hearing.
