exercises:
  translate:
  - hanzi: 明朝 落雨 个话 ， 阿拉 勿 去 了 。
    en: If it rains tomorrow, we won't go.
  - hanzi: 侬 个 电话号码 写 拨 我 。
    en: Write your phone number down for me.
  - hanzi: 快 一眼 ， 还 来得及 。
    en: Hurry, there's still time.
  fill:
  - hanzi: 我 买 了 三 ＿ 书 。
    en: I bought three books.
    answer: 本
  - hanzi: 我 去 外滩 ， 侬 ＿ ？
    en: I'm going to the Bund, and you?
    answer: 末
  - hanzi: 侬 屋里 个 ＿ 是 啥 ？
    en: What's your home address?
    answer: 地址
  say:
  - hanzi: 我 要 寄 快递 。
    en: I'd like to send a parcel.
  - hanzi: 一 个 礼拜 就 到 了 伐 ？
    en: Will it get there in a week?
  - hanzi: 茶叶 送 拨 侬 个 。
    en: The tea is a present for you.
