# Lesson schema: see course/README.md. hanzi = words separated by spaces (one space = one sandhi domain);
# a word can force its reading with IPA + Chao tones: 新[ɕin53], 法国人[fᴀʔ55_koʔ55_ȵin13].
id: 55
title:
  en: A job interview
  hanzi: 面试
review: false
setting: >-
  Sunday afternoon in the café of the language exchange. Xiao Zhang has an interview at a design company tomorrow; Sam plays
  the manager so that she can rehearse.
dialogue:
- n: 1
  speaker: 小张
  hanzi: 明朝 我 要 面试 ， 侬 搭 我 准备 。
  en: I have an interview tomorrow. Help me prepare.
- n: 2
  speaker: Sam
  hanzi: 好个 ， 我 来 做 经理 。 是 啥个 单位 ？
  en: All right, I'll be the manager. What sort of employer is it?
- n: 3
  speaker: 小张
  hanzi: 一 家 设计 公司 ， 条件 勿错 。
  en: A design company. The terms are pretty good.
- n: 4
  speaker: Sam
  hanzi: 侬好 ， 请 坐 。 侬 是 啥个 专业 毕业 个 ？
  en: Good morning, please sit down. What did you graduate in?
- n: 5
  speaker: 小张
  hanzi: 我 学 个 是 设计 ， 两 年 以前 毕业 个 。
  en: I studied design. I graduated two years ago.
- n: 6
  speaker: Sam
  hanzi: 侬 为啥 想 跳槽 ？ 老 单位 有 问题 伐 ？
  en: Why do you want to change jobs? Is there a problem at your old place?
- n: 7
  speaker: 小张
  hanzi: 呒没 。 我 希望 有 机会 学 新 技术 。
  en: No. I hope to have the chance to learn new techniques.
- n: 8
  speaker: Sam
  hanzi: 侬 觉着 自家 个 能力 哪能 ？
  en: How would you rate your own abilities?
- n: 9
  speaker: 小张
  hanzi: 我 做 事体 蛮 努力 ， 老 单位 侪 晓得 。
  en: I work hard, everyone at my old place knows that.
- n: 10
  speaker: Sam
  hanzi: 阿拉 办公室 老 忙 个 ， 八 点钟 下班 。
  en: 'Our office is very busy: we finish at eight in the evening.'
- n: 11
  speaker: 小张
  hanzi: 我 可以 个 。 工作 重要 ， 忙 勿要紧 。
  en: I can do that. Work is important, being busy doesn't matter.
- n: 12
  speaker: Sam
  hanzi: 勿错 ， 合同 我 搭 侬 准备 好 了 。
  en: Not bad. I've got the contract ready for you.
- n: 13
  speaker: 小张
  hanzi: 真个 啊 ？ 介 便当 就 成功 了 ？
  en: Really? I got it as easily as that?
- n: 14
  speaker: Sam
  hanzi: 我 勿是 真 个 经理 嘛 ！ 侬 讲 得 蛮 好 。
  en: I'm not a real manager, remember! You spoke very well.
- n: 15
  speaker: 小张
  hanzi: 就是 有 一眼 急 。 经理 会得 问 我 啥 ？
  en: I'm just a bit nervous. What will the manager ask me?
- n: 16
  speaker: Sam
  hanzi: 伊 会得 问 侬 ， 常庄 出差 可以 伐 ？
  en: He will ask you whether frequent business trips are all right.
- n: 17
  speaker: 小张
  hanzi: 侪 可以 ！ 我 再 搭 阿强 讲 一声 。
  en: Everything is fine! I'll just let A-Qiang know.
notes:
- ref: 1
  topic: grammar
  text: >-
    搭 before a person covers "with", "for" and "to": 搭我准备 "prepare with me, help me prepare", 合同我搭侬准备好了 (line 12) "I've
    prepared the contract for you", 搭阿强讲一声 (line 17) "say a word to A-Qiang". You met it as "and" (lesson 2) and "with"
    (lesson 7).
- ref: 1
  topic: vocab
  text: >-
    面试 "job interview", also a verb: 我要面试 "I have an interview".
- ref: 2
  topic: vocab
  text: >-
    经理 "manager". 单位 "work unit" is the careful, slightly official word for an employer: 老单位 "my old workplace". Among friends
    people say 公司.
- ref: 3
  topic: vocab
  text: >-
    设计 "design". 条件 "conditions, terms". 勿错 {勿错} "not bad, pretty good": listen to how 错 sounds in this word.
- ref: 4
  topic: grammar
  text: >-
    Careful and everyday wording. An interview is the place for 侬好，请坐 and for words shared with Mandarin: 专业 "field of study",
    毕业 "to graduate", 能力 "ability", 希望 "to hope". At home the same people would say 侬学啥个？ and 我想….
- ref: 6
  topic: vocab
  text: >-
    跳槽 "to change jobs", literally "to jump troughs". 问题 {问题} "problem, question": 问 has its literary reading here, not
    the {问} of 问 "to ask" (lesson 11).
- ref: 7
  topic: vocab
  text: >-
    机会 "chance, opportunity"; 技术 "technique, technology".
- ref: 9
  topic: vocab
  text: >-
    努力 "hard-working; to make an effort". 做事体 "to do things, to work".
- ref: 10
  topic: vocab
  text: >-
    办公室 "office". 忙 "busy". 下班 "to finish work", the opposite of 上班 (lesson 11).
- ref: 11
  topic: grammar
  text: >-
    Three words for "can": 可以 "it's possible, it's acceptable" (我可以个 "I can manage that"), 好 "may, it's all right to" (lesson
    12), and 会得 "know how to" or "will" (lessons 31, 41): 经理会得问我啥？ "what will the manager ask me?".
- ref: 12
  topic: vocab
  text: >-
    合同 "contract".
- ref: 13
  topic: vocab
  text: >-
    成功 "to succeed; success".
- ref: 16
  topic: vocab
  text: >-
    出差 "to go on a business trip".
