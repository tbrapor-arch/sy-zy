exercises:
  translate:
  - hanzi: 当时 我 一 句 也 听勿懂 。
    en: At the time I couldn't understand a word.
  - hanzi: 伊 突然 勿响 了 。
    en: He suddenly fell silent.
  - hanzi: 我 曾经 去 过 苏州 。
    en: I've been to Suzhou once.
  fill:
  - hanzi: 伊 问 我 ， 我 就 ＿ 了 。
    en: He asked me, and I said yes.
    answer: 答应
  - hanzi: 我 刚 出门 ， ＿ 落雨 了 。
    en: I had just gone out, and as luck would have it, it rained.
    answer: 齐巧
  - hanzi: 伊 ＿ 要 学 上海 闲话 。
    en: She has set her heart on learning Shanghainese.
    answer: 一门心思
  say:
  - hanzi: 我 害怕 。
    en: I'm afraid.
  - hanzi: 后首来 呢 ？
    en: And then?
  - hanzi: 搿 是 我 个 故事 。
    en: This is my story.
