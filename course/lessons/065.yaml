exercises:
  translate:
  - hanzi: 我 屋里 离 地铁 站头 老 近 个 。
    en: My place is very near the metro station.
  - hanzi: 伊 从来 勿 开车 ， 每日天 乘 公交 。
    en: He never drives, he takes the bus every day.
  - hanzi: 朝 前头 走 ， 出口 就 辣 对面 。
    en: Walk on ahead; the exit is just opposite.
  fill:
  - hanzi: 明朝 要 开会 ， 侬 ＿ 一眼 出门 。
    en: There's a meeting tomorrow, leave a bit early.
    answer: 提早
  - hanzi: ＿ 搿搭 到 外滩 要 几 站 ？
    en: How many stops is it from here to the Bund?
    answer: 从
  - hanzi: 高架 浪 ＿ ， 阿拉 乘 地铁 去 。
    en: 'The elevated road is jammed: let''s take the metro.'
    answer: 塞车
  say:
  - hanzi: 今朝 地铁 老 轧 个 。
    en: The metro is really packed today.
  - hanzi: 我 平常 七 点 出门 。
    en: I usually leave home at seven.
  - hanzi: 侬 屋里 离 公司 远 伐 ？
    en: Is your place far from the office?
