exercises:
  translate:
  - hanzi: 我 早浪 只 吃 一 副 大饼 油条 。
    en: In the morning I only have a flatbread and a dough stick.
  - hanzi: 搿 只[ʦᴀʔ55] 摊头 个 生煎馒头 老 好吃 个 。
    en: This stall's pan-fried buns are delicious.
  - hanzi: 侬 吃 甜 豆浆 还是 咸 豆浆 ？
    en: Do you have sweet soy milk or savoury?
  fill:
  - hanzi: 拿 油条 ＿ 辣 豆浆 里 。
    en: Dip the dough stick in the soy milk.
    answer: 浸
  - hanzi: 我 要 两 ＿ 油条 。
    en: I'd like two dough sticks.
    answer: 根
  - hanzi: 当心 ， 汤 要 ＿ 到 衣裳 浪 。
    en: Careful, the soup will drip on your clothes.
    answer: 滴
  say:
  - hanzi: 我 欢喜 吃 生煎馒头 。
    en: I love pan-fried buns.
  - hanzi: 侬 吃 过 早点 了 伐 ？
    en: Have you had breakfast?
  - hanzi: 搿 碗 馄饨 我 吃脱 伊 。
    en: I'll finish off this bowl of wontons.
