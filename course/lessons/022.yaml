exercises:
  translate:
  - hanzi: 阿拉 屋里 个 人 侪 欢喜 吃 生煎 。
    en: Everyone in my family likes pan-fried buns.
  - hanzi: 埃 个 小人 是 啥人 屋里 个 ？
    en: Whose child is that?
  - hanzi: 搿 种 衬衫 勿是 打八折 个 。
    en: This kind of shirt isn't 20% off.
  fill:
  - hanzi: 侬 ＿ 去 买 ， 我 勿 去 了 。
    en: Go and buy it yourself, I'm not going.
    answer: 自家
  - hanzi: 菜 我 侪 买 好 了 ， 侬 ＿ 吃 。
    en: I've bought all the food; eat properly.
    answer: 好好叫
  - hanzi: 楼高头 个 人家 夜里 老 ＿ 个 。
    en: The family upstairs is very noisy at night.
    answer: 吵
  say:
  - hanzi: 伊拉 侪 是 我 个 朋友 。
    en: They're all my friends.
  - hanzi: 侬 听见 了 伐 ？
    en: Did you hear?
  - hanzi: 埃 家 人家 礼拜六 搬 来 个 。
    en: That family moved in on Saturday.
