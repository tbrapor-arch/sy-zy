exercises:
  translate:
  - hanzi: 外婆 个 快递 收到 了 伐 ？
    en: Has Grandma's parcel arrived?
  - hanzi: 伊 拨 人家 骗 了 两百 块 。
    en: He was cheated out of two hundred yuan.
  - hanzi: 搿 件 衬衫 我 着 了 老 合身 。
    en: This shirt fits me really well.
  fill:
  - hanzi: 侬 讲 了 交关 ， 一眼 也 勿 讲 ＿ 。
    en: You've said a lot, but none of it makes sense.
    answer: 道理
  - hanzi: 伊 一 趟 也 呒没 ＿ 过 我 个 微信 。
    en: He has never once replied to my WeChat.
    answer: 回
  - hanzi: 网浪 买 个 物事 好 ＿ 伐 ？
    en: Can things bought online be returned?
    answer: 退
  say:
  - hanzi: 侬 个 外套 啥个 尺寸 ？
    en: What size is your jacket?
  - hanzi: 我 微信 浪 回 侬 了 。
    en: I've replied to you on WeChat.
  - hanzi: 搿 家 店 个 评价 老 好 。
    en: This shop has very good reviews.
