exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 电影 我 看 过 两 趟 了 。
    en: I've seen this film twice.
  - hanzi: 太阳 落山 了 ， 阿拉 屋里 去 。
    en: The sun has set, let's go home.
  - hanzi: 搿 只[ʦᴀʔ55] 博物馆 值得 去 看看 。
    en: This museum is worth a visit.
  fill:
  - hanzi: 夜里 云 少 ， 星星 老 多 ， ＿ 也 老 亮 。
    en: 'Few clouds tonight: lots of stars, and a bright moon.'
    answer: 月亮
  - hanzi: 伊 每日天 锻炼 ， ＿ 身体 介 好 。
    en: 'He runs every day: no wonder he is so fit.'
    answer: 怪勿得
  - hanzi: 上海 ＿ 侪 是 人 。
    en: There are people everywhere in Shanghai.
    answer: 到处
  say:
  - hanzi: 杭州 菜 我 吃 过 了 。
    en: I've had Hangzhou food.
  - hanzi: 搿 座 山 老 出名 个 。
    en: This mountain is very famous.
  - hanzi: 阿拉 拍 张 合影 。
    en: Let's take a photo together.
