exercises:
  translate:
  - hanzi: 搿 只[ʦᴀʔ55] 饭店 勿但 便宜 ， 而且 好吃 。
    en: This restaurant is not only cheap but good.
  - hanzi: 侬 稍为 快 一眼 ， 来勿及 了 。
    en: Go a bit faster, we'll be late.
  - hanzi: 冬天 着 大衣 ， 外加 一 条 围巾 。
    en: In winter wear a coat, plus a scarf.
  fill:
  - hanzi: 搿 条 裤子 忒 ＿ 了 ， 我 着 勿 进去 。
    en: These trousers are too tight, I can't get into them.
    answer: 紧
  - hanzi: 伊 个 衣裳 侪 老 ＿ 个 。
    en: Her clothes are always very fashionable.
    answer: 时髦
  - hanzi: 搿 件 棉袄 又 软 ＿ 厚 。
    en: This padded jacket is soft and thick.
    answer: 又
  say:
  - hanzi: 我 想 做 一 件 大衣 。
    en: I'd like to have a coat made.
  - hanzi: 搿 块 布 几钿 ？
    en: How much is this cloth?
  - hanzi: 稍为 便宜 一眼 好 伐 ？
    en: Could you make it a little cheaper?
