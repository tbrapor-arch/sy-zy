# The 100 lessons (as Tsheh-tû's syllabus.yaml): title + what each one teaches. Lessons 1–49 are written; 50–100 are
# the plan (10 Nov 2026): title, setting, grammar point (focus) and target new words, picked from the private master
# vocabulary by rank (untaught at L49, Shanghainese words first). Check with `make coverage` before each batch.
# Every 7th lesson is a review; the second wave starts at lesson 50. Lessons 85–100 move towards narrated passages.
# Refined 10 Nov 2026 after a check against Qian Nairong's word handbook and grammar: everyday basics that were missing
# (family, body, clothes, home, food, shops, weather) replace rarer or bookish words; 了 is the completion marker and 仔
# is taught as the older form; 辣海, 拿 and the modal words come back; every review has its focus.
lessons:
