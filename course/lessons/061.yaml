exercises:
  translate:
  - hanzi: 搿眼 苹果 侪 是 拨 侬 个 。
    en: These apples are all for you.
  - hanzi: 今朝 哪能介 冷 ？
    en: How come it is so cold today?
  - hanzi: 伊 读 中学 个 辰光 ， 成绩 邪气 好 。
    en: When she was at secondary school her marks were very good.
  fill:
  - hanzi: 侬 ＿ 做 勿 对 ， 我 教 侬 。
    en: You're doing it wrong like that, I'll show you.
    answer: 搿能
  - hanzi: 小囡 老 ＿ 个 ， 一眼 也 勿 吵 。
    en: The child is very good, not noisy at all.
    answer: 乖
  - hanzi: 明朝 要 ＿ ， 今朝 夜里向 早 一眼 困 。
    en: 'There''s a test tomorrow: go to bed a bit earlier tonight.'
    answer: 考试
  say:
  - hanzi: 我 是 大学 个 学生 。
    en: I'm a university student.
  - hanzi: 功课 做 好 了 伐 ？
    en: Have you finished your homework?
  - hanzi: 搿 只[ʦᴀʔ55] 题目 忒 难 了 。
    en: This question is too hard.
