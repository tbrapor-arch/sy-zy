exercises:
  translate:
  - hanzi: 听讲 下 个 礼拜 要 落雨 。
    en: They say it'll rain next week.
  - hanzi: 我 本生 想 去 ， 后首来 勿 去 了 。
    en: I meant to go at first, but in the end I didn't.
  - hanzi: 今朝 我 辣 地铁 里 碰着 老板 了 。
    en: I ran into the boss on the metro today.
  fill:
  - hanzi: 伊 今朝 勿 来 ， ＿ 伊 感冒 了 。
    en: He isn't coming today, because he has a cold.
    answer: 因得
  - hanzi: ＿ 侬 勿 吃 夜饭 ？
    en: Why aren't you having dinner?
    answer: 为啥
  - hanzi: 我 来 ＿ 一声 ， 搿 是 小李 。
    en: Let me introduce you, this is Xiao Li.
    answer: 介绍
  say:
  - hanzi: 好像 要 落雨 了 。
    en: It looks like rain.
  - hanzi: 侬 听讲 了 伐 ？
    en: Have you heard?
  - hanzi: 阿拉 娘舅 蹲 辣 美国 。
    en: My uncle lives in America.
