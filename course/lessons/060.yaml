exercises:
  translate:
  - hanzi: 伊 力道 大 得来 ， 一 只[ʦᴀʔ55] 手 好 拎 两 只[ʦᴀʔ55] 包 。
    en: He's so strong he can carry two bags in one hand.
  - hanzi: 我 爬 勿 动 了 ， 阿拉 休息 一歇 。
    en: I can't climb any further, let's rest a moment.
  - hanzi: 伊 每日天 清早 去 游泳 。
    en: She goes swimming early every morning.
  fill:
  - hanzi: 搿 只[ʦᴀʔ55] 包 忒 重 了 ， 我 拎 勿 ＿ 。
    en: This bag is too heavy, I can't lift it.
    answer: 动
  - hanzi: 一日到夜 加班 ， 我 身体 ＿ 了 。
    en: Working late day after day, my body can't take it any more.
    answer: 吃勿消
  - hanzi: 明朝 有 足球 ＿ ， 侬 看 伐 ？
    en: There's a football match tomorrow. Are you watching?
    answer: 比赛
  say:
  - hanzi: 我 欢喜 打 篮球 。
    en: I like playing basketball.
  - hanzi: 今朝 吃力 得来 。
    en: I'm so tired today.
  - hanzi: 侬 比 我 高 。
    en: You're taller than me.
