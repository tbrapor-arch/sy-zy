exercises:
  translate:
  - hanzi: 我 一 到 屋里 就 上床 了 。
    en: As soon as I got home I went to bed.
  - hanzi: 搿 碗 面 我 一枪头 吃光 了 。
    en: I finished this bowl of noodles in one go.
  - hanzi: 侬 覅 吵醒 小人 。
    en: Don't wake the child.
  fill:
  - hanzi: 我 ＿ 了 ， 阿拉 去 吃 饭 。
    en: 'I''m hungry: let''s go and eat.'
    answer: 饿
  - hanzi: 昨日 夜里 我 十二 点 就 ＿ 了 。
    en: Last night I fell asleep at midnight.
    answer: 困着
  - hanzi: 侬 ＿ 菜 ， 我 去 买 酒 。
    en: You order the dishes, I'll get the drinks.
    answer: 点
  say:
  - hanzi: 我 看看 手表 。
    en: I'll look at my watch.
  - hanzi: 末班 地铁 几 点 ？
    en: What time is the last metro?
  - hanzi: 一 吃 就 困着 了 。
    en: Fell asleep as soon as I ate.
