exercises:
  translate:
  - hanzi: 一家门 侪 到 娘舅 屋里 去 过年 。
    en: The whole family goes to my uncle's for New Year.
  - hanzi: 年初一 早浪 阿拉 吃 汤团 。
    en: On New Year's morning we eat glutinous rice balls.
  - hanzi: 压岁钿 侬 放 辣 啥地方 了 ？
    en: Where have you put your New Year money?
  fill:
  - hanzi: 伊 下 个 月 ＿ 美国 。
    en: She's going back to America next month.
    answer: 转去
  - hanzi: 侬 来 了 ， ＿ ， 阿拉 一道 吃 中饭 。
    en: You're here, perfect, let's have lunch together.
    answer: 正好
  - hanzi: ＿ 几 点钟 了 ？
    en: What time is it now?
    answer: 现在
  say:
  - hanzi: 阿姨 ， 新年好 ！
    en: Happy New Year, auntie!
  - hanzi: 小囡 拿 了 交关 红包 。
    en: The children got lots of red envelopes.
  - hanzi: 我 今年 勿 转去 过年 。
    en: I'm not going home for New Year this year.
