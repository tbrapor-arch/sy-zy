exercises:
  translate:
  - hanzi: 吃 饭 之前 ， 先 汏汏 手 。
    en: Wash your hands before eating.
  - hanzi: 等 伊 来 了 ， 阿拉 再 走 。
    en: We'll go once he's arrived.
  - hanzi: 我 一定 记牢 侬 个 闲话 。
    en: I'll be sure to remember what you said.
  fill:
  - hanzi: 侬 到 了 ， 要 ＿ 我 。
    en: When you arrive, get in touch.
    answer: 联系
  - hanzi: 飞机 几 点 ＿ ？
    en: What time does the plane take off?
    answer: 起飞
  - hanzi: 我 老 ＿ 屋里 人 。
    en: I miss my family a lot.
    answer: 想念
  say:
  - hanzi: 下趟见 ！
    en: See you next time!
  - hanzi: 开年 见 ！
    en: See you next year!
  - hanzi: 我 勿 会 忘记脱 侬 。
    en: I won't forget you.
