exercises:
  translate:
  - hanzi: 侬 阿是 辣 南京路 上班 ？
    en: Do you work on Nanjing Road?
  - hanzi: 银行 辣 道口 ， 朝 右 转弯 就 到 。
    en: 'The bank is at the crossroads: turn right and you''re there.'
  - hanzi: 我 一家头 去 ， 侬 覅 来 了 。
    en: I'll go on my own, you needn't come.
  fill:
  - hanzi: 侬 是 法国人 ， ＿ ？
    en: You're French, aren't you?
    answer: 对伐
  - hanzi: 外滩 辣 人民广场 个 ＿ 面 。
    en: The Bund is to the east of People's Square.
    answer: 东
  - hanzi: 我 ＿ 路 了 ， 侬 来 接 我 。
    en: 'I''m lost: come and get me.'
    answer: 寻勿着
  say:
  - hanzi: 侬 阿是 上海 人 ？
    en: Are you from Shanghai?
  - hanzi: 朝 右 转弯 ， 是伐 ？
    en: Turn right, is that it?
  - hanzi: 我 要 回转去 了 。
    en: I have to go back now.
