exercises:
  translate:
  - hanzi: 我 叫 伊 明朝 早 点 来 。
    en: I told him to come early tomorrow.
  - hanzi: 侬 让 我 想 一 想 。
    en: Let me think about it.
  - hanzi: 我 代 侬 去 买 票子 。
    en: I'll go and buy the tickets for you.
  fill:
  - hanzi: 衣裳 还 呒没 ＿ ， 覅 着 。
    en: The clothes aren't dry yet, don't wear them.
    answer: 干
  - hanzi: 侬 屋里 介 龌龊 ， 要 ＿ 了 。
    en: Your place is so dirty, it needs a clean.
    answer: 打扫
  - hanzi: 搿 只[ʦᴀʔ55] 碗 ＿ 了 ， 覅 用 。
    en: This bowl is cracked, don't use it.
    answer: 破
  say:
  - hanzi: 卫生间 漏水 了 。
    en: The bathroom is leaking.
  - hanzi: 麻烦 侬 了 。
    en: Sorry to trouble you.
  - hanzi: 我 自家 来 修 。
    en: I'll fix it myself.
