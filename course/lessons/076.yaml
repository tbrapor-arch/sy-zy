exercises:
  translate:
  - hanzi: 我 个 阿哥 辣 北京 上班 。
    en: My elder brother works in Beijing.
  - hanzi: 伊 姓 张 ， 侪 叫 伊 小张 。
    en: Her surname is Zhang; everyone calls her Xiao Zhang.
  - hanzi: 阿娘 老 了 ， 要 人 照顾 。
    en: Grandma is old and needs looking after.
  fill:
  - hanzi: 侬 ＿ 啥 ？ 我 姓 张 。
    en: What's your surname? Mine is Zhang.
    answer: 姓
  - hanzi: 我 爷 个 阿哥 ， 我 叫 伊 ＿ 。
    en: My father's elder brother I call 阿伯.
    answer: 阿伯
  - hanzi: 伊 有 一 个 儿子 ， 一 个 ＿ 。
    en: She has a son and a daughter.
    answer: 囡儿
  say:
  - hanzi: 我 有 一 个 阿姐 。
    en: I have an elder sister.
  - hanzi: 侬 有 兄弟 伐 ？
    en: Do you have brothers?
  - hanzi: 阿娘 九十 岁 了 。
    en: Grandma is ninety.
