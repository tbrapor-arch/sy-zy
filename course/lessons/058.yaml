exercises:
  translate:
  - hanzi: 我 送 拨 姆妈 一 条 项链 。
    en: I gave my mother a necklace.
  - hanzi: 侬 拿 搿 只[ʦᴀʔ55] 请帖 拨 小李 。
    en: Give this invitation to Xiao Li.
  - hanzi: 伊 着 了 西装 ， 邪气 登样 。
    en: He looks very smart in a suit.
  fill:
  - hanzi: 礼拜六 侬 来 ＿ 阿拉 个 聚会 伐 ？
    en: Are you coming to our get-together on Saturday?
    answer: 参加
  - hanzi: ＿ 侬 生日 快乐 ！
    en: Happy birthday to you!
    answer: 祝
  - hanzi: 伊拉 是 大学 ＿ ， 认得 十 年 了 。
    en: They were at university together; they've known each other ten years.
    answer: 同学
  say:
  - hanzi: 新娘 邪气 标致 。
    en: The bride is very pretty.
  - hanzi: 我 拨 伊 一 只[ʦᴀʔ55] 红包 。
    en: I give him a red envelope.
  - hanzi: 礼拜六 阿拉 去 吃 喜酒 。
    en: On Saturday we're going to a wedding.
