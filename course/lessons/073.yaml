exercises:
  translate:
  - hanzi: 我 小 个 辰光 ， 屋里 老 穷 个 。
    en: When I was small, my family was very poor.
  - hanzi: 伊 从小 就 住 辣 上海 。
    en: She has lived in Shanghai since she was small.
  - hanzi: 麻将 我 年纪 轻 个 辰光 搓 过歇 个 。
    en: I played mahjong once, long ago, when I was young.
  fill:
  - hanzi: 侬 还 ＿ 伐 ？ 阿拉 辣 杭州 见 过 个 。
    en: Do you still remember? We met in Hangzhou.
    answer: 记得
  - hanzi: ＿ 勿 见 ， 侬 好 伐 ？
    en: Long time no see, how are you?
    answer: 长远
  - hanzi: 我 ＿ 了 ， 钥匙 辣 包 里 。
    en: 'Now I remember: the keys are in the drawer.'
    answer: 想起来
  say:
  - hanzi: 我 是 辣 法国 生 个 。
    en: I was born in France.
  - hanzi: 从前 搿搭 侪 是 石库门 。
    en: This used to be all shikumen houses.
  - hanzi: 侬 小 个 辰光 白相 啥 ？
    en: What did you play when you were small?
