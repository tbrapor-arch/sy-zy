exercises:
  translate:
  - hanzi: 讲到 天气 末 ， 我 欢喜 秋天 。
    en: As for the weather, I like autumn.
  - hanzi: 伊 个 闲话 比较 快 。
    en: He talks rather fast.
  - hanzi: 搿 只[ʦᴀʔ55] 城市 个 空气 老 好 。
    en: The air in this city is very good.
  fill:
  - hanzi: 上海 闲话 搭 ＿ 勿 一样 。
    en: Shanghainese is not the same as Mandarin.
    answer: 普通话
  - hanzi: 每 只[ʦᴀʔ55] 城市 侪 有 自家 个 ＿ 。
    en: Every city has its own dialect.
    answer: 方言
  - hanzi: 苏州 闲话 ＿ 上海 闲话 勿 同 。
    en: Suzhou speech is not like Shanghainese.
    answer: 同
  say:
  - hanzi: 我 欢喜 上海 。
    en: I like Shanghai.
  - hanzi: 侬 会 讲 普通话 伐 ？
    en: Can you speak Mandarin?
  - hanzi: 一般 我 七 点 起来 。
    en: As a rule I get up at seven.
