exercises:
  translate:
  - hanzi: 侬 拿 窗 关关 伊 ， 外头 落雨 了 。
    en: Shut the window, it's raining outside.
  - hanzi: 隔壁 只[ʦᴀʔ55] 狗 夜里 老 欢喜 叫 个 。
    en: The dog next door loves barking at night.
  - hanzi: 我 只[ʦᴀʔ55] 猫 欢喜 爬 树 。
    en: My cat likes climbing trees.
  fill:
  - hanzi: 侬 只[ʦᴀʔ55] 手 老 ＿ ， 去 汏汏 伊 。
    en: Your hands are filthy, go and wash them.
    answer: 龌龊
  - hanzi: 猫 ＿ 出去 了 ， 快 点 寻 。
    en: The cat has got out, quick, look for it.
    answer: 逃
  - hanzi: 当心 ， 伊 要 ＿ 人 个 。
    en: Careful, it bites.
    answer: 咬
  say:
  - hanzi: 我 来 寻寻 伊 。
    en: I'll look for it.
  - hanzi: 猫 爬 到 树 浪 去 了 。
    en: The cat has climbed up a tree.
  - hanzi: 侬 欢喜 猫 还是 狗 ？
    en: Do you prefer cats or dogs?
