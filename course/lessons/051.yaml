exercises:
  translate:
  - hanzi: 我 每日天 夜里向 十 点钟 困 。
    en: I go to bed at ten every night.
  - hanzi: 伊 老是 迟到 ， 老板 动气 了 。
    en: He's always late, and the boss has got angry.
  - hanzi: 有常时 我 清早 去 菜场 买 鱼 。
    en: Sometimes I go to the market early in the morning to buy fish.
  fill:
  - hanzi: 侬 ＿ 几 点钟 起床 ？
    en: What time do you usually get up?
    answer: 平常
  - hanzi: 昨日子 我 困 得 忒 ＿ 了 。
    en: I went to bed too late yesterday.
    answer: 晏
  - hanzi: 上半日 我 勿 空 ， ＿ 好 伐 ？
    en: I'm not free in the morning. Would the afternoon do?
    answer: 下半天
  say:
  - hanzi: 我 常庄 吃 泡饭 。
    en: I often have 泡饭.
  - hanzi: 快 去 刷 牙齿 ！
    en: Go and brush your teeth, quick!
  - hanzi: 搿 两 天 日脚 过 得 蛮 开心 。
    en: Life has been pretty good these last few days.
