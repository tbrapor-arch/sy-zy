exercises:
  translate:
  - hanzi: 伊 一面 吃 饭 ， 一面 看 手机 。
    en: He eats while looking at his phone.
  - hanzi: 搿 只[ʦᴀʔ55] 歌 八十 年代 老 流行 个 。
    en: This song was very popular in the eighties.
  - hanzi: 侬 个 讲法 搭 我 勿 一样 。
    en: You say it differently from me.
  fill:
  - hanzi: 伊 坐 辣海 ， 一眼 也 ＿ 。
    en: She sat there without saying a word.
    answer: 勿响
  - hanzi: 侬 听 了 有 啥 ＿ ？
    en: How does it make you feel?
    answer: 感觉
  - hanzi: 我 小 辰光 学 过歇 ＿ 。
    en: I learnt the piano for a while as a child.
    answer: 钢琴
  say:
  - hanzi: 我 欢喜 听 老 歌 。
    en: I love old songs.
  - hanzi: 侬 会 唱 伐 ？
    en: Can you sing?
  - hanzi: 搿 张 唱片 老 好听 。
    en: This record is lovely.
