- hanzi: 出
  en: to go out of, exit
- hanzi: 边浪
  en: beside, next to
exercises:
  translate:
  - hanzi: 请 侬 拿 护照 拨 我 看看 。
    en: Please let me see your passport.
  - hanzi: 以后 侬 用勿着 带 钞票 了 。
    en: From now on you won't need to carry cash.
  - hanzi: 门口 个 机器 坏脱 了 ， 只好 进来 取 。
    en: The machine at the door is broken, so you'll have to come in to take money out.
  fill:
  - hanzi: 搿搭 坐 地铁 交关 ＿ 。
    en: Taking the metro from here is very convenient.
    answer: 便当
  - hanzi: 侬 要 ＿ 钞票 还是 取 钞票 ？
    en: Do you want to deposit or withdraw money?
    answer: 存
  - hanzi: 今朝 ＿ 冷 啊 ！
    en: It's so cold today!
    answer: 介
  say:
  - hanzi: 银行 几 点钟 开 门 ？
    en: What time does the bank open?
  - hanzi: 请 侬 等 一眼 。
    en: Please wait a moment.
  - hanzi: 我 要 去 银行 办 事体 。
    en: I have to go to the bank to sort something out.
