exercises:
  translate:
  - hanzi: 我 用 上海闲话 发 了 一 条 消息 拨 小李 。
    en: I sent Xiao Li a message in Shanghainese.
  - hanzi: 侬 个 发音 比 我 好 交关 。
    en: Your pronunciation is much better than mine.
  - hanzi: 咦 ， 搿 个 词 我 呒没 学 过 嘛 。
    en: Eh? But I've never learnt this word.
  fill:
  - hanzi: 学堂 里 老师 讲 ＿ ， 屋里 讲 上海闲话 。
    en: At school the teachers speak Mandarin; at home we speak Shanghainese.
    answer: 普通话
  - hanzi: 搿 个 ＿ 是 啥 意思 ？
    en: What does this word mean?
    answer: 词
  - hanzi: 我 去 买 菜 ， 侬 ＿ ？
    en: I'm going to buy food. What about you?
    answer: 呢
  say:
  - hanzi: 喔唷 ， 介 贵 啊 ！
    en: Wow, that expensive!
  - hanzi: 苏州闲话 也 是 一 种 方言 。
    en: Suzhou speech is a dialect too.
  - hanzi: 嗯 ， 我 晓得 了 。
    en: Mm, I see.
