  en: to treat (pay for everyone)
exercises:
  translate:
  - hanzi: 姆妈 烧 个 小菜 味道 老 好 。
    en: The dishes my mum cooks taste very good.
  - hanzi: 连得 阿拉 爷 也 会得 烧 番茄炒蛋 。
    en: Even my dad can make tomato and egg.
  - hanzi: 侬 吃饱 了 伐 ？ 再 搛 一眼 。
    en: Have you had enough? Take a bit more.
  fill:
  - hanzi: 今朝 我 ＿ ， 㑚 侪 覅 付 钞票 。
    en: It's on me today, none of you pay.
    answer: 请客
  - hanzi: 蛋糕 吃 了 两 块 ， ＿ 了 。
    en: I've had two pieces of cake, I can't eat any more.
    answer: 吃勿落
  - hanzi: 搿 只[ʦᴀʔ55] 鱼 ＿ 邪气 好 。
    en: This fish tastes really good.
    answer: 味道
  say:
  - hanzi: 侬 吃吃看 ， 好吃 伐 ？
    en: Try it, is it good?
  - hanzi: 阿拉 一道 干杯 ！
    en: Let's all drink to that!
  - hanzi: 我 勿 会得 用 筷子 。
    en: I can't use chopsticks.
